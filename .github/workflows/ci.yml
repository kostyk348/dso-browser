name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkitgtk-6.0-dev libgtk-4-dev libsodium-dev pkg-config
      - name: Fetch the sibling DSO runtime (external dependency of the CMake build)
        run: |
          git clone --depth 1 https://github.com/kostyk348/dso-runtime.git ../dso-runtime
          cmake -B ../dso-runtime/build -DCMAKE_BUILD_TYPE=Release ../dso-runtime
          cmake --build ../dso-runtime/build -j
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
